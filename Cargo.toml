[package]
name = "bilibili-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# 只用 glow(OpenGL) 渲染后端，不用 wgpu —— 二者画面表现一致，
# 但能省下 wgpu-core/naga/wgpu-hal 这一整套 Vulkan/DX12 着色器栈（体积大头）
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "accesskit",
] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
percent-encoding = "2.3.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
# 体积优化：跨模块内联 + 单一 codegen 单元，消除未使用代码
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
